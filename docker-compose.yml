# Mandarin DAC Bridge — docker compose up -d --build
services:
  dac-bridge:
    build: .
    image: mandarin-dac-bridge
    container_name: mandarin-dac-bridge
    restart: unless-stopped
    # UPnP discovery is multicast: the container must be on the host's network.
    network_mode: host
    # The host's sound devices: handed over, openable (privileged), and
    # mounted so a DAC plugged in later is found too.
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    volumes:
      - /dev/snd:/dev/snd
      - dac-bridge-data:/data
    # Lets the bridge feed the DAC at real-time priority (optional, recommended).
    cap_add:
      - SYS_NICE
    environment:
      - TZ=Europe/London
      # - BRIDGE_IP=192.168.1.20     # only if the machine has several networks

volumes:
  dac-bridge-data:
