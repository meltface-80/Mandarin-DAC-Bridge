# Mandarin DAC Bridge — docker compose up -d --build
services:
  dac-bridge:
    build: .
    image: mandarin-dac-bridge
    container_name: mandarin-dac-bridge
    restart: unless-stopped
    # UPnP, Squeezebox and Spotify discovery are multicast/broadcast: the container must be on the host's network.
    network_mode: host
    # The host's sound devices: handed over, openable (privileged), and
    # mounted so a DAC plugged in later is found too.
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    volumes:
      - /dev/snd:/dev/snd
      - dac-bridge-data:/data
    # Lets the bridge feed the DAC at real-time priority (optional, recommended).
    cap_add:
      - SYS_NICE
    environment:
      - TZ=Europe/London
      # - BRIDGE_IP=192.168.1.20     # only if the machine has several networks
      # Squeezebox and Spotify can be switched on on the page instead:
      # - SQUEEZELITE=1               # each DAC is a Squeezebox player (Lyrion, Roon)
      # - LMS_SERVER=192.168.1.30     # the server, if it isn't found by itself
      # - SPOTIFY=1                   # each DAC is a Spotify Connect speaker (Spotify Soloist: download it on the page)

volumes:
  dac-bridge-data:
