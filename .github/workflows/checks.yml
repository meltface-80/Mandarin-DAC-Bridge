name: Checks

# The gates and the whole suite (dev/quality.md). A test that does not block a release is a
# suggestion, so these run before anything is built or published:
#   test-image.yml calls this on every branch push before it builds the branch's test image;
#   release.yml calls this before it builds a release: a red check means no release.
# A pull request runs it as well, under these job names, which the rulesets on dev and main
# require: the pull request shows red or green before the owner merges.
#
# The steps are the commands a contributor runs locally (tools/check.sh).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Gates (file length, analyzers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the commit before (a pull request's base), for the length baseline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: File length, the gates' own tests, the build with the analyzers (tools/check.sh gates)
        env:
          BASELINE_FROM: HEAD~1
        run: tools/check.sh gates

  test:
    # A stalled audio test would otherwise hold the run for GitHub's default of six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: ffmpeg (and on Linux ALSA and PulseAudio)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libasound2t64 pulseaudio pulseaudio-utils clang zlib1g-dev ;;
            macOS)   brew install ffmpeg-full && echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH" ;;
            Windows) choco install ffmpeg-full -y --no-progress ;;
          esac
      # The bridge resamples with SoX or refuses (Audio/Soxr.cs): without it here, the resampling tests
      # would test the refusal instead, and pass.
      - name: ffmpeg has SoX
        shell: bash
        run: ffmpeg -hide_banner -buildconf 2>&1 | grep -q -- '--enable-libsoxr' || { echo "::error::this runner's ffmpeg has no SoX (libsoxr)"; exit 1; }
      - run: dotnet test -c Release
      # The native program each platform gets, and its own sound-device code run for real
      # (Core Audio on macOS, WASAPI on Windows, ALSA on Linux): it must list and diagnose without failing.
      - name: Native AOT build
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: dotnet publish src/MandarinDacBridge -c Release -r "$RID" -o out
      - name: Smoke run
        shell: bash
        run: |
          exe=out/mandarin-dac-bridge; [ "$RUNNER_OS" = Windows ] && exe=out/mandarin-dac-bridge.exe
          "$exe" --version
          "$exe" --list
          "$exe" --diagnose
      # The Mac's "DAC Bridge" output: built, installed (sudo, Core Audio restarted) and checked
      # bit-for-bit at three rates. Informational: a runner may lack audio or microphone access.
      - name: Mac audio driver loopback
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          bash tools/mac/driver.sh
          out/mandarin-dac-bridge --loopback-test
      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'tools/windows/install.ps1', 'tools/windows/uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${f}: $_" }; exit 1 }
          }
