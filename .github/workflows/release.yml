# Builds Mandarin DAC Bridge for every platform (macOS, Linux, Windows; x64
# and ARM) and attaches it to a GitHub
# Release. On GitHub: Releases → Draft a new release → tag v1.0.0 → Publish.
# A few minutes later the installer's link (releases/latest/download/…)
# serves the new build.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libasound2t64
      - run: dotnet test -c Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || v="1.0.0"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Native AOT build
        run: dotnet publish src/MandarinDacBridge -c Release -r ${{ matrix.rid }} -p:Version=${{ env.VERSION }} -o out
      - name: Package
        if: runner.os != 'Windows'
        run: tar -czf mandarin-dac-bridge-${{ matrix.rid }}.tar.gz -C out mandarin-dac-bridge
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/mandarin-dac-bridge.exe -DestinationPath mandarin-dac-bridge-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mandarin-dac-bridge-${{ matrix.rid }}
          path: mandarin-dac-bridge-${{ matrix.rid }}.*

  release:
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mandarin-dac-bridge-*.tar.gz
            mandarin-dac-bridge-*.zip
