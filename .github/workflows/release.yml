name: Deploy Native AOT Releases

on:
  push:
    tags:
      - 'v*' # Triggers the build sequence automatically on version tags like v1.0.0

permissions:
  contents: write # Grants permission to create GitHub Releases and upload binaries

jobs:
  build-and-release:
    name: Build AOT for ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact_name: mandarin-bridge-mac-arm64
          - os: macos-latest
            rid: osx-x64
            artifact_name: mandarin-bridge-mac-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: mandarin-bridge-linux-x64

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Setup the .NET 10 SDK environment using the preview channel
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    # Native AOT on Linux requires clang and zlib libraries
    - name: Install Linux Build Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev

    - name: Restore Project Dependencies
      run: dotnet restore MandarinDacBridge.csproj

    # Compile the standalone binary without runtime dependencies
    - name: Compile Native AOT Binary
      run: |
        dotnet publish MandarinDacBridge.csproj \
          -c Release \
          -r ${{ matrix.rid }} \
          -o ./publish \
          /p:PublishAot=true

    # Package the native binary into a clean tarball payload
    - name: Compress Target Package
      run: |
        cd publish
        tar -czf ../${{ matrix.artifact_name }}.tar.gz *
        cd ..

    # Upload compilation fragments to a shared repository release page
    - name: Generate GitHub Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
