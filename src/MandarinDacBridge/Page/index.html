<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAC Bridge</title>
<meta name="description" content="Mandarin DAC Bridge: the USB DACs on this machine, held exclusively and offered to Audirvana and Mandarin.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  @font-face { font-family: "Manrope"; src: url("fonts/manrope.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "Young Serif"; src: url("fonts/young-serif.woff2") format("woff2"); font-display: swap; }
  :root {
    --bg: #17191c; --bg-deep: #121416; --panel: #1f2226; --panel-2: #262a2f; --line: #30353b;
    --text: #ecebe6; --muted: #9a9ca1; --gold: #c9a45c; --gold-hi: #d4b06a; --gold-dim: #6e5a32;
    --wash: rgba(201,164,92,.08); --good: #8fc19a; --warn: #e0a96d; --bad: #e07a6d;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: "Young Serif", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f3ef; --bg-deep: #ece9e2; --panel: #fbfaf7; --panel-2: #f1efe9; --line: #d6d2c8;
      --text: #17191c; --muted: #4f5257; --gold: #7a5a1f; --gold-hi: #7a5a1f; --gold-dim: #b9a57a;
      --wash: rgba(122,90,31,.07); --good: #2f6b45; --warn: #8a5a12; --bad: #a33b2b;
      --shadow: 0 10px 30px rgba(40,30,10,.12);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  header { max-width: 1040px; margin: 0 auto; padding: 36px 20px 8px; display: flex; align-items: center; gap: 14px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  header h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .host { margin-left: auto; color: var(--muted); font-size: 12.5px; text-align: right; }

  main { max-width: 1040px; margin: 0 auto; padding: 18px 20px 60px; }
  .banner { border: 1px solid var(--gold-dim); background: var(--wash); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

  .tile { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 20px 18px; cursor: pointer; min-height: 150px; display: flex; flex-direction: column; gap: 4px;
    transition: border-color .15s, transform .15s, box-shadow .15s; }
  .tile:hover { border-color: var(--gold-dim); transform: translateY(-2px); box-shadow: var(--shadow); }
  .tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .tile .name { font-family: var(--serif); font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
  .tile .model { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tile .state { margin-top: auto; padding-top: 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tile .state span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--gold); }
  .dot.play { background: var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); }
  .dot.wait { background: var(--warn); }
  .dot.off { background: transparent; border: 1px solid var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 70px 20px; border: 1px dashed var(--line); border-radius: 16px; }
  .others { margin-top: 18px; color: var(--muted); font-size: 13.5px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--panel); }
  .others summary { cursor: pointer; }
  .others ul { margin: 10px 0 2px 18px; display: grid; gap: 4px; }
  .empty h2 { font-family: var(--serif); font-weight: 400; color: var(--text); font-size: 22px; margin-bottom: 6px; }

  /* The DAC's page */
  .sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .sheet.open { display: flex; }
  .card { position: relative; width: 100%; max-width: 640px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 24px 24px; box-shadow: var(--shadow); }
  .close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
  .close:hover { border-color: var(--gold-dim); }
  .close svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .card h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.2; padding-right: 48px; overflow-wrap: anywhere; }
  .card .model { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .card h3 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 26px 0 8px; }
  .now { margin-top: 18px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
  .now .line1 { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .now .meta { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
  .now .fmt { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .now .warn { color: var(--warn); font-size: 13.5px; }

  dl { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; border-top: 1px solid var(--line); }
  dt, dd { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  dt { color: var(--muted); padding-right: 12px; }
  dd { overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--bg-deep); }
  .chip.on { border-color: var(--gold); color: var(--gold); }
  ul.formats { list-style: none; display: grid; gap: 4px; }
  ul.formats li { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:first-of-type { border-top: 1px solid var(--line); }
  .row .lbl { font-size: 14px; }
  .row .hint { color: var(--muted); font-size: 12.5px; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; background: var(--line); border: 0; cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--gold); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--bg); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
  .btn { border: 1px solid var(--gold-dim); background: var(--wash); border-radius: 10px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; flex: none; }
  .btn:hover { border-color: var(--gold); }
  .foot { margin-top: 22px; color: var(--muted); font-size: 12.5px; }
  header .nowlink { color: var(--gold); text-decoration: none; font-size: 13px; border: 1px solid var(--gold-dim); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  header .nowlink:hover { border-color: var(--gold); }

  /* Connections: the ways in besides UPnP */
  .conn { margin-top: 30px; }
  .conn h2 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 10px; }
  .conn .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; }
  .conn .row:first-of-type { border-top: 0; }
  .conn .row:last-child { border-bottom: 0; }
  .conn .row > div:first-child { min-width: 0; }
  .conn input[type=text], .conn input[type=password], .conn select { font: inherit; font-size: 13.5px; color: var(--text); background: var(--bg-deep); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; width: 220px; max-width: 100%; }
  .conn input[type=text]:focus, .conn input[type=password]:focus, .conn select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .conn .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 12px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.on { border-color: var(--gold); color: var(--gold); }
  .hint a { color: var(--gold); }
  .conn .hint { overflow-wrap: anywhere; }
  .conn .code { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; color: var(--gold); }
  @media (max-width: 520px) { .conn .row { flex-direction: column; align-items: stretch; } .conn .ctl { justify-content: flex-start; } }
  @media (max-width: 520px) {
    header { padding-top: 24px; flex-wrap: wrap; }
    header .host { margin-left: 0; text-align: left; width: 100%; }
    .sheet { padding: 0; }
    .card { border-radius: 0; min-height: 100vh; border: 0; padding-top: 24px; }
    dl { grid-template-columns: 1fr; }
    dt { padding-bottom: 0; border-bottom: 0; }
  }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <div>
    <h1>DAC Bridge</h1>
    <div class="sub">Mandarin · exclusive, bit-perfect USB DACs</div>
  </div>
  <div class="host" id="host"></div>
  <a class="nowlink" href="/now" title="A now-playing screen, for a display beside the DAC">Now Playing ↗</a>
</header>

<main>
  <div class="banner" id="banner" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h2>No USB DACs found</h2>
    <p>Plug one in: it appears here within a few seconds.</p>
  </div>
  <details class="others" id="others" hidden>
    <summary>Other sound devices seen, not bridged</summary>
    <ul id="others-list"></ul>
  </details>

  <section class="conn" aria-labelledby="conn-h">
    <h2 id="conn-h">Connections</h2>
    <div class="panel" id="conn"></div>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name">
  <div class="card" id="card"></div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kHz = (r) => (r / 1000).toFixed(r % 1000 ? 1 : 0).replace(/\.0$/, "") + " kHz";
const dsdOf = (dopRate) => "DSD" + Math.round(dopRate * 16 / 44100);
const time = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

let data = { dacs: [] };
let openId = null;

const SHARED = "shared: let go while idle, for other players";

function state(d) {
  if (!d.enabled) return { cls: "off", text: "Not bridged · left to the Mac" };
  if (!d.exclusive && d.share) return d.holder ? { cls: "wait", text: `Shared · ${d.holder} is playing` } : { cls: "ok", text: "Shared · free for other players" };
  if (!d.exclusive) return { cls: "wait", text: d.holder ? `Waiting · ${d.holder} has the DAC` : "Waiting for the DAC" };
  const p = d.player || {}, who = d.control && d.control.owner;
  if (p.transport === "PLAYING" || p.transport === "TRANSITIONING") return { cls: "play", text: `${who ? who + " · " : ""}${p.format || "Playing"}` };
  if (p.transport === "PAUSED_PLAYBACK") return { cls: "ok", text: `Paused${who ? " · " + who : ""}` };
  if (p.status === "ERROR_OCCURRED") return { cls: "wait", text: p.error || "Couldn't play" };
  return { cls: "ok", text: "Exclusive · ready" };
}

function renderTiles() {
  const g = $("#grid");
  $("#empty").hidden = data.dacs.length > 0;
  g.innerHTML = data.dacs.map((d) => {
    const s = state(d);
    const model = [d.manufacturer, d.name !== d.deviceName ? d.deviceName : ""].filter(Boolean).join(" · ") || d.transport;
    return `<button class="tile" data-id="${esc(d.id)}" aria-label="${esc(d.name)}: show capabilities">
      <div class="name">${esc(d.name)}</div>
      <div class="model">${esc(model)}</div>
      <div class="state"><span class="dot ${s.cls}"></span><span>${esc(s.text)}</span></div>
    </button>`;
  }).join("");
  const others = data.others || [];
  $("#others").hidden = others.length === 0;
  if (!data.dacs.length && others.length) $("#others").open = true;
  $("#others-list").innerHTML = others.map((o) => `<li>${esc(o)}</li>`).join("");
  const b = $("#banner");
  b.hidden = !data.error;
  b.textContent = data.error || "";
  $("#host").textContent = data.host ? `${data.host} · v${data.version}` : "";
  renderConnections();
}

// The ways in: UPnP (always), Squeezebox, Spotify, Qobuz, Plex, this Mac's apps, Roon Bridge alongside, and the display.
function renderConnections() {
  const sv = data.services;
  if (!sv) return;
  const el = $("#conn");
  if (el.contains(document.activeElement) && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;   // don't redraw under typing
  const sq = data.dacs.map((d) => d.squeezebox).filter(Boolean);
  const sp = data.dacs.map((d) => d.spotify).filter(Boolean);
  const nowUrl = `${location.protocol}//${location.host}/now`;
  el.innerHTML = `
    <div class="row">
      <div><div class="lbl">UPnP / DLNA</div><div class="hint">Audirvana, Mandarin, BubbleUPnP, JRiver… choose “${esc((data.dacs[0] && data.dacs[0].upnpName) || "<DAC> (Bridge)")}”.</div></div>
      <div class="ctl"><span class="tag on">Always on</span></div>
    </div>
    <div class="row">
      <div><div class="lbl">Squeezebox (squeezelite)</div>
        <div class="hint">Each DAC becomes a player for Lyrion Music Server, or for Roon with its Squeezebox support switched on.
        ${sv.squeezelite && sq.length ? "<br>" + esc(sq[0]) : ""}</div></div>
      <div class="ctl">
        ${sv.squeezelite ? `<input type="text" id="c-lms" placeholder="Server: found by itself" value="${esc(sv.lmsServer)}" aria-label="Squeezebox server address">` : ""}
        <button class="switch" role="switch" aria-checked="${sv.squeezelite}" aria-label="Squeezebox" id="c-sq"></button>
      </div>
    </div>
    <div class="row">
      <div><div class="lbl">Spotify Connect</div>
        <div class="hint">${!sv.spotifyPossible
          ? `Through Spotify Soloist, Spotify's own Connect client, which runs on Linux only.${sv.macPossible ? " On this Mac, the Spotify app plays through the bridge instead: <b>This Mac</b> below." : ""} <a href="https://meltface-80.github.io/Mandarin-DAC-Bridge/#spotify" target="_blank" rel="noopener">More</a>.`
          : `Each DAC appears in Spotify's device list, through <b>Spotify Soloist</b> (Spotify's own Connect client; Premium).
             You need your own <a href="https://developer.spotify.com/dashboard/soloist" target="_blank" rel="noopener">Soloist API key</a>.
             ${sv.spotify ? "<br>" + spotifyState(sv, sp) : ""}`}</div></div>
      <div class="ctl">
        ${sv.spotify && sv.spotifyPossible ? `<input type="password" id="c-key" autocomplete="off" placeholder="${sv.soloistKey ? "API key set ✓ (type to replace)" : "Soloist API key"}" aria-label="Soloist API key">
          ${!sv.soloist || sv.soloistDownload || (sv.soloistExpires && sv.soloistExpires <= new Date().toISOString().slice(0, 10)) ? `<button class="btn" id="c-dl"${sv.soloistDownload.startsWith("downloading") ? " disabled" : ""}>${sv.soloist ? "Download again" : "Download Soloist"}</button>` : ""}` : ""}
        <button class="switch" role="switch" aria-checked="${sv.spotify}" aria-label="Spotify Connect" id="c-sp"></button>
      </div>
    </div>
    <div class="row">
      <div><div class="lbl">Qobuz Connect</div>
        <div class="hint">Each DAC appears in the Qobuz app's device list, through <b>QobuzProxy</b>, in hi-res up to what the DAC takes.
          ${sv.qobuz ? "<br>" + qobuzState(sv) : ""}</div></div>
      <div class="ctl">
        ${sv.qobuz && (!sv.qobuzInstalled || sv.qobuzInstall) ? `<button class="btn" id="c-qi"${sv.qobuzInstall && !sv.qobuzInstall.startsWith("install failed") ? " disabled" : ""}>${sv.qobuzInstalled ? "Install again" : "Install QobuzProxy"}</button>` : ""}
        ${sv.qobuz && sv.qobuzInstalled && !sv.qobuzSignedIn ? `<a class="btn" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${location.protocol}//${location.hostname}:${sv.qobuzWebPort}/">Sign in to Qobuz</a>` : ""}
        <button class="switch" role="switch" aria-checked="${sv.qobuz}" aria-label="Qobuz Connect" id="c-qb"></button>
      </div>
    </div>
    <div class="row">
      <div><div class="lbl">Plex · Caldera Headless</div>
        <div class="hint">${!sv.calderaPossible
          ? "Caldera Headless runs on Linux only."
          : `Each DAC becomes a Plex player for Plexamp, Plex for iOS and the Plex web app, through <b>Caldera Headless</b>. Caldera plays to the DAC itself, bit-perfect, and shares it with the bridge: whoever plays first has it.
             ${sv.caldera ? "<br>" + calderaState(sv, data.dacs.map((d) => d.caldera).filter(Boolean)) : ""}`}</div></div>
      <div class="ctl">
        ${sv.caldera && sv.calderaPossible && (!sv.calderaVersion || sv.calderaDownload) ? `<button class="btn" id="c-cdl"${sv.calderaDownload.startsWith("downloading") ? " disabled" : ""}>${sv.calderaVersion ? "Download again" : "Download Caldera"}</button>` : ""}
        ${sv.caldera && sv.calderaPossible && !sv.plexSignedIn && !sv.plexCode ? `<button class="btn" id="c-plex">Sign in to Plex</button>` : ""}
        <button class="switch" role="switch" aria-checked="${sv.caldera}" aria-label="Plex through Caldera Headless" id="c-cal"></button>
      </div>
    </div>
    ${sv.macPossible ? `<div class="row">
      <div><div class="lbl">This Mac: Apple Music &amp; Spotify</div>
        <div class="hint">The Music app and the Spotify app on this Mac play through the bridge to a DAC, bit-perfect, the DAC at each track's own rate.
          They play to the <b>DAC Bridge</b> output (an audio driver, installed once), which is the Mac's sound output while this is on.
          Experimental above 44.1 kHz (a click now and then).
          <a href="https://meltface-80.github.io/Mandarin-DAC-Bridge/#mac-apps" target="_blank" rel="noopener">More</a>.
          ${sv.macApps ? "<br>" + macState(sv) : ""}</div></div>
      <div class="ctl">
        ${sv.macApps && data.dacs.length > 1 ? `<select id="c-mdac" aria-label="The DAC for the Mac's apps">${data.dacs.map((d) => `<option value="${esc(d.id)}"${d.id === sv.macDac ? " selected" : ""}>${esc(d.name)}</option>`).join("")}</select>` : ""}
        <button class="switch" role="switch" aria-checked="${sv.macApps}" aria-label="Apple Music and Spotify on this Mac" id="c-mac"></button>
      </div>
    </div>` : ""}
    <div class="row">
      <div><div class="lbl">Roon Bridge</div>
        <div class="hint">Runs beside the bridge, not inside it. Switch on <b>Share when idle</b> on a DAC to let Roon use it while nothing else plays.
        <a href="https://meltface-80.github.io/Mandarin-DAC-Bridge/#roon" target="_blank" rel="noopener">Installing it</a>.</div></div>
      <div class="ctl"><span class="tag${sv.roonBridge ? " on" : ""}">${sv.roonBridge ? esc(sv.roonBridge) + " running" : "Not seen here"}</span></div>
    </div>
    <div class="row">
      <div><div class="lbl">Now-playing screen</div><div class="hint">For a monitor or TV beside the DAC: open <a href="/now">${esc(nowUrl)}</a> full-screen. Optional.</div></div>
      <div class="ctl"><a class="btn" href="/now" style="text-decoration:none;color:inherit">Open</a></div>
    </div>`;
  $("#c-sq").onclick = () => postServices({ squeezelite: !sv.squeezelite });
  $("#c-sp").onclick = () => postServices({ spotify: !sv.spotify });
  const lms = $("#c-lms");
  if (lms) lms.onchange = () => postServices({ lmsServer: lms.value });
  const key = $("#c-key");
  if (key) key.onchange = () => { if (key.value.trim()) postServices({ soloistKey: key.value.trim() }); };
  $("#c-cal").onclick = () => postServices({ caldera: !sv.caldera });
  $("#c-qb").onclick = () => postServices({ qobuz: !sv.qobuz });
  const mac = $("#c-mac");
  if (mac) mac.onclick = () => postServices({ macApps: !sv.macApps });
  const mdac = $("#c-mdac");
  if (mdac) mdac.onchange = () => postServices({ macDac: mdac.value });
  for (const [sel, url] of [["#c-cdl", "/api/services/caldera"], ["#c-plex", "/api/services/plex"], ["#c-qi", "/api/services/qobuz"]]) {
    const b = $(sel);
    if (b) b.onclick = async () => {
      b.disabled = true;
      try { await fetch(url, { method: "POST" }); } catch (e) { /* next refresh */ }
      refresh();
    };
  }
  const dl = $("#c-dl");
  if (dl) dl.onclick = async () => {
    dl.disabled = true;
    try { await fetch("/api/services/soloist", { method: "POST" }); } catch (e) { /* next refresh */ }
    refresh();
  };
}

// What's still needed for the Mac's apps, or how it is.
function macState(sv) {
  if (!sv.macDriver) return `The DAC Bridge output isn't on this Mac yet. In Terminal, run<br><code>/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/meltface-80/Mandarin-DAC-Bridge/main/tools/mac/driver.sh)"</code><br>(it asks for your password; the Mac's sound stops for a few seconds). The first time something plays, macOS asks to allow Microphone access: that is how the bridge reads the DAC Bridge output back (it never listens to a microphone).`;
  return esc(sv.macStatus || "starting…");
}

// What's still needed for Qobuz, or how it is.
function qobuzState(sv) {
  if (sv.qobuzInstall) return esc(sv.qobuzInstall);
  if (!sv.qobuzInstalled) return "QobuzProxy isn't installed yet: <b>Install QobuzProxy</b> fetches it from GitHub into a private Python environment (Python 3.10 or later needed).";
  return esc(sv.qobuzStatus || "starting…");
}

// What's still needed for Caldera, or how it is.
function calderaState(sv, statuses) {
  const parts = [];
  if (sv.calderaDownload) parts.push(esc(sv.calderaDownload));
  else if (!sv.calderaVersion) parts.push("Caldera isn't on this machine yet: <b>Download Caldera</b> fetches it from Caldera.");
  else parts.push("Caldera Headless " + esc(sv.calderaVersion) + " (it updates itself)");
  if (sv.plexCode) parts.push(`Go to <a href="https://plex.tv/link" target="_blank" rel="noopener">plex.tv/link</a> and enter <b class="code">${esc(sv.plexCode)}</b>`);
  else if (!sv.plexSignedIn) parts.push("Sign in to Plex." + (sv.plexMessage ? " " + esc(sv.plexMessage) : ""));
  if (statuses.length) parts.push(esc(statuses[0]));
  return parts.join("<br>");
}

// What's still needed for Spotify, or how it is.
function spotifyState(sv, statuses) {
  const parts = [];
  if (sv.soloistDownload) parts.push(esc(sv.soloistDownload));
  else if (!sv.soloist) parts.push("Soloist isn't on this machine yet: <b>Download Soloist</b> fetches it from Spotify.");
  else parts.push(esc(sv.soloistVersion.replace(/ \(g[0-9a-f]+\).*$/, "")) + (sv.soloistExpires ? ` · this build lasts until ${esc(sv.soloistExpires)}` : ""));
  if (!sv.soloistKey) parts.push("Type your Soloist API key.");
  if (!sv.pulseAudio) parts.push("Needs PulseAudio: <code>sudo apt install pulseaudio</code> (it's in the Docker image).");
  if (statuses.length) parts.push(esc(statuses[0]));
  return parts.join("<br>");
}

async function postServices(body) {
  try { await fetch("/api/services", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); } catch (e) { /* next refresh */ }
  if (document.activeElement) document.activeElement.blur();
  refresh();
}

function renderSheet() {
  const d = data.dacs.find((x) => x.id === openId);
  if (!d) { closeSheet(); return; }
  const s = state(d), p = d.player || {}, c = d.control || {};
  const rates = d.rates.length ? d.rates.map((r) => `<span class="chip${p.format && d.currentRate === r ? " on" : ""}">${kHz(r)}</span>`).join("") : "<span class=\"hint\">not reported</span>";
  const bits = d.bits.length ? d.bits.map((b) => `<span class="chip">${b}-bit</span>`).join("") : "<span class=\"hint\">not reported</span>";
  let dsd = [];
  if (d.dsdNative && d.dsdNative.length) dsd.push("Native DSD (" + d.dsdNative.map(kHz).join(", ") + ")");
  if (d.dopRates && d.dopRates.length) dsd.push("DoP up to " + dsdOf(Math.max(...d.dopRates)) + " if the DAC decodes DoP");
  const vol = d.volume == null ? "" : `<dt>Mac volume</dt><dd>${Math.round(d.volume * 100)}%${d.volume < 0.999 ? ' <span class="hint">— set it to 100% in Audio MIDI Setup for bit-perfect</span>' : ""}</dd>`;
  const playing = p.transport && p.transport !== "STOPPED" && p.transport !== "NO_MEDIA_PRESENT";
  const blocked = c.blocked ? `<div class="meta">Kept ${esc(c.blocked.name)} out (${esc(c.blocked.action)}, ${Math.round((Date.now() - c.blocked.at) / 1000)} s ago)</div>` : "";

  $("#card").innerHTML = `
    <button class="close" id="close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
    <h2 id="d-name">${esc(d.name)}</h2>
    <div class="model">${esc([d.manufacturer, d.deviceName !== d.name ? d.deviceName : ""].filter(Boolean).join(" · ") || d.transport)}</div>

    <div class="now">
      <div class="line1"><span class="dot ${s.cls}"></span><span>${esc(s.cls === "play" ? "Playing" + (c.owner ? " · " + c.owner : "") : s.text)}</span></div>
      ${d.enabled && !d.exclusive && d.share && !d.holder ? `<div class="meta">Shared: free for other players until an app plays here.</div>` : ""}
      ${playing && (p.title || p.artist) ? `<div class="meta">${esc(p.title)}${p.artist ? " — " + esc(p.artist) : ""}${p.duration ? ` · ${time(p.position)} / ${time(p.duration)}` : ""}</div>` : ""}
      ${playing && p.format ? `<div class="fmt">${esc(p.format)}${p.physical ? " → DAC " + esc(p.physical) : ""}</div>` : ""}
      ${c.owner && d.enabled ? `<div class="meta">In control: ${esc(c.owner)}${c.locked ? " (others are kept out)" : ""}</div>` : ""}
      ${blocked}
      ${d.enabled && !d.exclusive && d.waiting && d.waiting !== SHARED && !d.share ? `<div class="warn">${esc(d.waiting)}. ${d.platform === "darwin" ? "In Audirvana, choose <b>" + esc(d.upnpName || d.name) + "</b> as the output (UPnP) instead of the DAC itself; the bridge takes the DAC as soon as it is let go." : "Switch the DAC off in the other program; the bridge takes it as soon as it is free."}</div>` : ""}
    </div>

    <h3>Capabilities</h3>
    <dl>
      <dt>Connection</dt><dd>${esc(d.transport)}${d.usb ? ` <span class="chip">${esc(d.usb)}</span>` : ""}</dd>
      <dt>Channels</dt><dd>${d.channels}</dd>
      <dt>Sample rates</dt><dd><div class="chips">${rates}</div></dd>
      <dt>Bit depths</dt><dd><div class="chips">${bits}</div></dd>
      <dt>DSD</dt><dd>${dsd.length ? esc(dsd.join(" · ")) : "PCM only"}</dd>
      ${d.currentRate ? `<dt>Running at</dt><dd>${kHz(d.currentRate)}</dd>` : ""}
      ${vol}
      <dt>Formats</dt><dd><ul class="formats">${(d.formats || []).map((f) => `<li>${esc(f)}</li>`).join("") || "<li>—</li>"}</ul></dd>
      ${d.upnpName ? `<dt>On the network</dt><dd>${esc(d.upnpName)} <span class="hint">· UPnP</span>${d.squeezebox ? `<br><span class="hint">Squeezebox: ${esc(d.squeezebox)} (${esc(d.squeezeboxId)})</span>` : ""}${d.spotify ? `<br><span class="hint">Spotify: ${esc(d.spotify)}</span>` : ""}${d.caldera ? `<br><span class="hint">Plex (Caldera): ${esc(d.caldera)}</span>` : ""}</dd>` : ""}
    </dl>

    <h3>Settings</h3>
    <div class="row">
      <div><div class="lbl">Bridge this DAC</div><div class="hint">Off: the bridge lets go and the Mac or other apps can use it.</div></div>
      <button class="switch" role="switch" aria-checked="${d.enabled}" aria-label="Bridge this DAC" id="s-enabled"></button>
    </div>
    <div class="row">
      <div><div class="lbl">DSD files</div><div class="hint">DoP sends DSD untouched; PCM converts it. Auto: DoP where the DAC reports DSD.</div></div>
      <div class="seg" role="group" aria-label="DSD files">
        ${["auto", "dop", "pcm"].map((m) => `<button data-dsd="${m}" aria-pressed="${d.dsd === m}">${m === "auto" ? "Auto" : m.toUpperCase()}</button>`).join("")}
      </div>
    </div>
    <div class="row">
      <div><div class="lbl">Share when idle</div><div class="hint">Lets go of the DAC whenever nothing plays through the bridge, so Roon Bridge or another player on this machine can use it. Taken back when an app plays here.</div></div>
      <button class="switch" role="switch" aria-checked="${!!d.share}" aria-label="Share when idle" id="s-share"></button>
    </div>
    ${c.owner && d.enabled ? `<div class="row"><div><div class="lbl">Hand over</div><div class="hint">Lets another app take this DAC now, even while ${esc(c.owner)} holds it.</div></div><button class="btn" id="s-release">Release</button></div>` : ""}
    <div class="foot">Volume is fixed at 100% for bit-perfect playback: use the DAC's or amplifier's volume.</div>`;

  $("#close").onclick = closeSheet;
  $("#s-enabled").onclick = () => post(`/api/dacs/${d.id}/settings`, { enabled: !d.enabled });
  $("#s-share").onclick = () => post(`/api/dacs/${d.id}/settings`, { share: !d.share });
  for (const b of document.querySelectorAll("[data-dsd]")) b.onclick = () => post(`/api/dacs/${d.id}/settings`, { dsd: b.dataset.dsd });
  const r = $("#s-release");
  if (r) r.onclick = () => post(`/api/dacs/${d.id}/release`, {});
}

function openSheet(id) {
  openId = id;
  renderSheet();
  $("#sheet").classList.add("open");
  document.body.style.overflow = "hidden";
  const c = $("#close");
  if (c) c.focus();
}
function closeSheet() {
  const was = openId;
  openId = null;
  $("#sheet").classList.remove("open");
  document.body.style.overflow = "";
  const t = was && document.querySelector(`.tile[data-id="${was}"]`);
  if (t) t.focus();
}

$("#grid").addEventListener("click", (e) => { const t = e.target.closest(".tile"); if (t) openSheet(t.dataset.id); });
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openId) closeSheet(); });

async function post(url, body) {
  try { await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); } catch (e) { /* the next refresh shows it */ }
  refresh();
}

async function refresh() {
  try {
    const r = await fetch("/api/dacs", { cache: "no-store" });
    data = await r.json();
  } catch (e) {
    data = Object.assign({}, data, { error: "The bridge isn't answering. Is it running?" });
  }
  renderTiles();
  if (openId) renderSheet();
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
